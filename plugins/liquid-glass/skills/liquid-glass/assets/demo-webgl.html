<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Liquid Glass — WebGL tier demo</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #16213e; }
  canvas { position: fixed; display: block; }
  #scene { inset: 0; width: 100%; height: 100%; }
  .glass {
    pointer-events: none;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22), 0 2px 6px rgba(0, 0, 0, 0.12); /* rule 4: float */
  }
  #card { left: calc(50% - 180px); top: calc(50% - 150px); width: 360px; height: 200px; border-radius: 28px; }
  #pill { left: calc(50% - 90px); top: calc(50% + 80px); width: 180px; height: 56px; border-radius: 28px; }
  #status {
    position: fixed; left: 0; right: 0; bottom: 18px; margin: 0; text-align: center; color: #fff; opacity: 0.75;
    font: 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }
</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <canvas id="card" class="glass"></canvas>
  <canvas id="pill" class="glass"></canvas>
  <p id="status">loading…</p>

  <script type="module">
    import { WebGLGlass } from './webgl-glass.js';

    const scene = document.getElementById('scene');
    const status = document.getElementById('status');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const font = '-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif';

    // A busy scene (stripes, colour blobs, big type) so bending and frost are obvious.
    function drawScene() {
      const w = innerWidth;
      const h = innerHeight;
      scene.width = Math.round(w * dpr);
      scene.height = Math.round(h * dpr);
      const g = scene.getContext('2d');
      g.scale(dpr, dpr);
      g.fillStyle = '#16213e';
      g.fillRect(0, 0, w, h);
      g.strokeStyle = '#1a1a2e';
      g.lineWidth = 22;
      for (let x = -h; x < w + h; x += 44) {
        g.beginPath();
        g.moveTo(x, 0);
        g.lineTo(x + h, h);
        g.stroke();
      }
      for (const [x, y, r, colour] of [[0.2, 0.2, 0.4, '#ff5f6d'], [0.8, 0.3, 0.45, '#12c2e9'], [0.5, 0.8, 0.45, '#f7b733']]) {
        const blob = g.createRadialGradient(x * w, y * h, 0, x * w, y * h, r * Math.max(w, h));
        blob.addColorStop(0, colour);
        blob.addColorStop(1, 'rgba(0, 0, 0, 0)');
        g.fillStyle = blob;
        g.fillRect(0, 0, w, h);
      }
      g.fillStyle = '#fff';
      g.textAlign = 'center';
      g.font = `700 64px ${font}`;
      g.fillText('Liquid Glass', w / 2, h / 2 - 40);
      g.font = `500 20px ${font}`;
      g.fillText('WebGL tier: refraction over a canvas', w / 2, h / 2 + 10);
    }

    // Each pane refracts the part of the scene underneath it.
    const panes = [
      { el: document.getElementById('card'), options: { radius: 28, scale: 70, chroma: 0.5 } },
      { el: document.getElementById('pill'), options: { radius: 28, scale: 40, chroma: 0.4, dark: true } },
    ];
    try {
      for (const pane of panes) {
        pane.backdrop = document.createElement('canvas');
        pane.glass = new WebGLGlass(pane.el, pane.options);
      }
      status.textContent = 'WebGL2 glass over a canvas scene. Move the pointer to move the highlight.';
    } catch (err) {
      status.textContent = err.message;
      throw err;
    }

    function renderAll() {
      if (!scene.width || !scene.height) return; // viewport not laid out yet
      for (const pane of panes) {
        const r = pane.el.getBoundingClientRect();
        if (!r.width || !r.height) continue;
        pane.el.width = pane.backdrop.width = Math.round(r.width * dpr);
        pane.el.height = pane.backdrop.height = Math.round(r.height * dpr);
        pane.backdrop.getContext('2d').drawImage(
          scene, r.left * dpr, r.top * dpr, r.width * dpr, r.height * dpr,
          0, 0, pane.backdrop.width, pane.backdrop.height,
        );
        pane.glass.setBackground(pane.backdrop).render();
      }
    }

    addEventListener('pointermove', (e) => {
      for (const pane of panes) {
        const r = pane.el.getBoundingClientRect();
        pane.glass.options.light = [e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2)];
      }
      renderAll();
    });
    addEventListener('resize', () => { drawScene(); renderAll(); });
    drawScene();
    renderAll();
  </script>
</body>
</html>
